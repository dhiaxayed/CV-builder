services:
  cv-builder-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-builder-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      LATEX_CMD: ${LATEX_CMD:-xelatex}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    expose:
      - "3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2.8-alpine
    container_name: cv-builder-caddy
    restart: unless-stopped
    depends_on:
      cv-builder-app:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

