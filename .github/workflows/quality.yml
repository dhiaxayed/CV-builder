name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LATEX_RENDERER: system
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-xetex lmodern poppler-utils
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm test:pdf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python scripts/check-pdf-layout.py output/pdf/system-templates
      - run: pnpm build
      - run: LATEX_RENDERER=tectonic pnpm test:pdf
      - run: python scripts/check-pdf-layout.py
      - run: node scripts/verify-function-bundles.mjs
      - run: pnpm test:production
      - run: E2E_DATABASE_KEY_TYPE=secret pnpm test:production
      - run: pnpm test:production:legacy
      - run: pnpm test:e2e
      - run: E2E_DATABASE_KEY_TYPE=public pnpm test:e2e
      - run: pnpm audit --prod --audit-level moderate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            test-results
            playwright-report
          retention-days: 7
